name: Release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $VERSION_NUMBER = $env:GITHUB_REF_NAME
          $version = $VERSION_NUMBER
          if ($version.StartsWith('v', [StringComparison]::Ordinal)) {
            $version = $version.Substring(1)
          }

          "tag=$VERSION_NUMBER" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=SharpKit_Win64_$VERSION_NUMBER.zip" >> $env:GITHUB_OUTPUT

      - name: Publish SharpKit
        run: dotnet publish SharpKit/SharpKit.csproj -c Release "-p:Version=${{ steps.version.outputs.version }}"

      - name: Package publish output
        id: package
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE 'SharpKit\bin\Release\net10.0-windows\win-x64\publish'
          $archivePath = Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE_NAME

          if (-not (Test-Path -LiteralPath $publishDirectory -PathType Container)) {
            throw "Publish directory was not created: $publishDirectory"
          }

          Compress-Archive -Path (Join-Path $publishDirectory '*') -DestinationPath $archivePath -Force
          "archive=$env:ARCHIVE_NAME" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
